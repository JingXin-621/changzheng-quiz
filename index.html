<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>长征红色问答挑战</title>
<style>
:root{--r:#C41E3A;--rd:#8B0000;--g:#D4A853;--bg:#FDF6F0;--c:#FFF;--t:#2C2C2C;--ts:#999;--b:#E8E0D5;--s:0 2px 12px rgba(0,0,0,.08);--R:16px;--h:56px;--tab:64px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--rd),var(--r));color:#fff;height:var(--h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 8px rgba(139,0,0,.3)}
.header .logo{font-size:18px;font-weight:700;letter-spacing:1px}
.streak{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:13px}
.main{padding:16px 16px calc(var(--tab)+16px);max-width:720px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--c);border-radius:var(--R);padding:18px;margin-bottom:14px;box-shadow:var(--s);border:1px solid var(--b)}
.ct{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px;color:var(--rd)}
.btn{height:46px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 18px;font-family:inherit;transition:all .2s}
.btn:active{transform:scale(.96)}
.btn1{background:linear-gradient(135deg,var(--r),#E8485A);color:#fff;box-shadow:0 4px 12px rgba(196,30,58,.3)}
.btn2{background:#fff;color:var(--r);border:2px solid var(--r)}
.btnL{height:54px;font-size:17px;width:100%}
.btnS{height:34px;font-size:12px;padding:0 12px;border-radius:16px}
.rank-box{text-align:center;padding:12px 0}
.rank-badge{width:90px;height:90px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,var(--g),#B8860B);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;box-shadow:0 4px 18px rgba(212,168,83,.5)}
.rank-name{font-size:22px;font-weight:800;color:var(--rd)}
.rank-sub{font-size:12px;color:var(--ts)}
.exp-track{height:8px;background:#F0E6D8;border-radius:4px;overflow:hidden;margin-top:12px}
.exp-fill{height:100%;background:linear-gradient(90deg,var(--r),var(--g));border-radius:4px;transition:width .6s}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{padding:12px 8px;text-align:center;background:linear-gradient(135deg,#FFF8F0,#FFF0E8);border-radius:10px;border:1px solid #F0E0D0}
.sv{font-size:20px;font-weight:700;color:var(--rd)}
.sl{font-size:11px;color:var(--ts)}
.quizQ{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:16px}
.quizOpts{display:flex;flex-direction:column;gap:8px}
.qOpt{width:100%;padding:14px 16px;text-align:left;border:2px solid var(--b);border-radius:10px;background:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit;color:var(--t);transition:all .2s}
.qOpt:active{transform:scale(.98)}
.qOpt .ol{width:28px;height:28px;border-radius:50%;background:#F5F5F5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--ts)}
.qOpt.ok{border-color:#2E7D32!important;background:#F1F8E9!important}
.qOpt.ok .ol{background:#2E7D32;color:#fff}
.qOpt.no{border-color:#E8485A!important;background:#FFF0F0!important}
.qOpt.no .ol{background:#E8485A;color:#fff}
.qExp{margin-top:14px;padding:14px;border-radius:10px;background:#FFF8E1;border:1px solid #FFE082;font-size:13px;line-height:1.7;color:#5D4037;display:none}
.qExp.s{display:block}
.qRes{text-align:center;padding:16px 0}
.rIcon{font-size:56px}
.rScore{font-size:42px;font-weight:900;color:var(--r)}
.rLabel{font-size:13px;color:var(--ts);margin:8px 0}

.rank-tabs{display:flex;margin-bottom:14px;background:var(--c);border-radius:10px;overflow:hidden;box-shadow:var(--s);border:1px solid var(--b)}
.rtab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--ts);border:none;background:transparent;font-family:inherit}
.rtab.on{background:var(--r);color:#fff}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:10px;padding:12px 14px;box-shadow:var(--s);border:1px solid var(--b)}
.ritem.me{border:2px solid var(--r);background:linear-gradient(135deg,#FFF5F5,#fff)}
.rav{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--r),#E8485A);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.rinfo{flex:1}
.rn{font-size:14px;font-weight:600}
.rs{font-size:15px;font-weight:700;color:var(--r);flex-shrink:0}

.tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--tab);background:#fff;display:flex;border-top:1px solid var(--b);z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.tab-i{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ts);border:none;background:none;font-family:inherit;font-size:10px}
.tab-i .ti{font-size:20px}
.tab-i.on{color:var(--r);font-weight:600}
.quiz-dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
.qd{width:8px;height:8px;border-radius:50%;background:#E0D5C5}
.qd.done{background:#2E7D32}
.qd.wrong{background:#E8485A}
.qd.cur{background:var(--g);transform:scale(1.4)}
.exp-info{font-size:12px;color:var(--ts);margin:12px 0}
.klist{display:flex;flex-direction:column;gap:8px}
.kitem{background:var(--c);border-radius:10px;padding:14px;box-shadow:var(--s);border:1px solid var(--b)}
.kitem .kq{font-size:14px;font-weight:600;margin-bottom:4px}
.kitem .ka{font-size:13px;color:#2E7D32}
.kitem .ke{font-size:12px;color:var(--ts);margin-top:4px;line-height:1.6}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2C2C2C,#444);color:#FFD700;padding:12px 22px;border-radius:28px;font-weight:700;font-size:14px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .4s ease,tout .4s ease 2.5s forwards;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tout{from{opacity:1}to{opacity:0;transform:translateX(-50%) translateY(-20px)}}
@media(min-width:768px){.tab-bar{position:fixed;top:var(--h);left:0;bottom:auto;width:180px;height:calc(100vh - var(--h));flex-direction:column;padding:8px 0;border-right:1px solid var(--b);border-top:none;box-shadow:none}.tab-i{flex:none;flex-direction:row;padding:12px 18px;gap:10px;font-size:14px;justify-content:flex-start}.main{margin-left:180px;margin-top:var(--h);padding:20px 28px 28px;max-width:calc(100% - 180px)}}
</style>
</head>
<body>

<header class="header">
<div class="logo">⭐ 长征红色问答挑战</div>
<div class="streak" id="streakBadge">🔥 连续 1 天</div>
</header>

<main class="main">

<!-- 首页 -->
<section class="page on" id="pg-home">
<div class="card"><div class="rank-box">
<div class="rank-badge" id="rankEmoji">⭐</div>
<div class="rank-name" id="rankName">新兵</div>
<div class="rank-sub" id="rankSub">开始答题，解锁更高军衔！</div>
<div class="exp-track"><div class="exp-fill" id="expBar" style="width:0%"></div></div>
<div class="exp-info" id="expDetail">0/100 积分</div>
</div></div>
<div class="card"><div class="ct">📊 我的战绩</div>
<div class="stats">
<div class="stat"><div class="sv" id="sScore">0</div><div class="sl">总积分</div></div>
<div class="stat"><div class="sv" id="sCorrect">0</div><div class="sl">答对题数</div></div>
<div class="stat"><div class="sv" id="sAccuracy">0%</div><div class="sl">正确率</div></div>
</div></div>
<div class="card" style="text-align:center">
<div style="font-size:42px;margin-bottom:6px" id="todayIcon">📝</div>
<div style="font-size:17px;font-weight:700" id="todayTitle">今日挑战</div>
<div style="font-size:13px;color:var(--ts);margin:4px 0 14px" id="todayDesc">每天5道长征知识题</div>
<button class="btn btn1 btnL" id="startBtn" onclick="startQuiz()">⚡ 开始今日答题</button>
<div style="font-size:12px;color:var(--ts);margin-top:6px" id="todayInfo"></div>
</div>
<div style="display:flex;gap:8px">
<button class="btn btn2" style="flex:1" onclick="switchTab('knowledge')">📚 知识库</button>
<button class="btn btn1" style="flex:1" onclick="shareText()">📤 分享战绩</button>
</div>
</section>

<!-- 答题 -->
<section class="page" id="pg-quiz">
<div class="card" id="quizCard">
<div class="quiz-dots" id="quizDots"></div>
<div class="quiz-question-num" id="quizNum" style="font-size:12px;color:var(--r);font-weight:600;margin-bottom:6px"></div>
<div class="quizQ" id="quizQ"></div>
<div class="quizOpts" id="quizOpts"></div>
<div class="qExp" id="quizExp"><div style="font-weight:700;color:#E65100;margin-bottom:2px">📖 知识解析</div><div id="quizExpT"></div></div>
</div>
<div class="card" id="quizResult" style="display:none"><div class="qRes">
<div class="rIcon" id="rIcon">🎉</div>
<div class="rScore" id="rScore">+500</div>
<div class="rLabel">本次获得积分</div>
<div id="rDetail" style="font-size:13px;line-height:1.8;color:var(--ts)"></div>
<button class="btn btn1 btnL" style="margin-top:10px" onclick="shareText()">📤 分享好友</button>
<button class="btn btn2" style="width:100%;margin-top:8px" onclick="switchTab('home')">🏠 返回首页</button>
</div></div>
</section>

<!-- 排行榜 -->
<section class="page" id="pg-leaderboard">
<div class="rank-tabs">
<button class="rtab on" onclick="swRank('total',this)">🏆 总榜</button>
<button class="rtab" onclick="swRank('weekly',this)">📅 周榜</button>
<button class="rtab" onclick="swRank('daily',this)">🔥 日榜</button>
</div>
<div class="rlist" id="rankList"></div>
<div class="card" style="margin-top:12px;text-align:center"><div style="color:var(--ts)">我的排名</div><div style="font-size:28px;font-weight:800;color:var(--r)" id="myRank">-</div></div>
</section>

<!-- 知识库 -->
<section class="page" id="pg-knowledge">
<div class="card"><div class="ct">📚 红色知识库</div>
<div class="klist" id="klist"></div></div>
</section>

</main>

<nav class="tab-bar">
<button class="tab-i on" data-tab="home" onclick="switchTab('home')"><span class="ti">🏠</span>首页</button>
<button class="tab-i" data-tab="quiz" onclick="switchTab('quiz')"><span class="ti">✏️</span>答题</button>
<button class="tab-i" data-tab="leaderboard" onclick="switchTab('leaderboard')"><span class="ti">🏆</span>排行</button>
<button class="tab-i" data-tab="knowledge" onclick="switchTab('knowledge')"><span class="ti">📚</span>知识</button>
</nav>

<script>
// === 题库（30题，精简版）===
var Q=[
{q:"中央红军长征的出发时间是？",o:["1933年10月","1934年10月","1935年1月","1936年10月"],a:1,e:"1934年10月，中央红军从江西瑞金出发，开始二万五千里长征。出发时约8.6万人。",t:"时间节点"},
{q:"长征出发地主要在哪里？",o:["井冈山","江西瑞金","湖南韶山","贵州遵义"],a:1,e:"瑞金是中华苏维埃共和国临时中央政府所在地，被称为"红色故都"。",t:"出发地"},
{q:"被称为党史上"生死攸关的转折点"的会议是？",o:["八七会议","古田会议","遵义会议","瓦窑堡会议"],a:2,e:"1935年1月遵义会议确立了毛泽东的领导地位，挽救了党和红军。",t:"重要会议"},
{q:"长征行程约多少里？",o:["一万五千里","二万里","二万五千里","三万里"],a:2,e:"中央红军长征约二万五千里（12500公里），毛泽东写道"红军不怕远征难，万水千山只等闲"。",t:"基本数据"},
{q:"中央红军长征历时约多少天？",o:["约180天","约260天","约368天","约500天"],a:2,e:"从1934年10月到1935年10月，历时约368天，途经14个省。",t:"基本数据"},
{q:"红军出发时约有多少人？",o:["约3万","约5万","约8.6万","约12万"],a:2,e:"出发时约8.6万人，到达陕北仅剩约7000人，每12人中仅1人走到终点。",t:"基本数据"},
{q:"四渡赤水发生在哪条河？",o:["金沙江","大渡河","赤水河","乌江"],a:2,e:"1935年1-3月，毛泽东指挥红军四渡赤水河，以3万对40万，灵活机动成功突围。",t:"经典战役"},
{q:"飞夺泸定桥发生在？",o:["1934年12月","1935年5月","1935年8月","1936年1月"],a:1,e:"1935年5月29日，22勇士冒弹雨攀13根铁索夺桥，为红军北上打开通道。",t:"经典战役"},
{q:"红军翻越的第一座大雪山是？",o:["玉龙雪山","岷山","夹金山","祁连山"],a:2,e:"夹金山海拔4114米，1935年6月翻越。许多南方战士因严寒缺氧长眠于此。",t:"自然环境"},
{q:""半条被子"的故事发生在哪个省？",o:["江西","湖南","贵州","四川"],a:1,e:"1934年11月在湖南汝城，3名女红军把唯一的被子剪半条留给老人，体现军民鱼水情。",t:"感人故事"},
{q:"刘伯承与哪位彝族首领歃血为盟？",o:["阿甲","小叶丹","阿旺","博巴"],a:1,e:"1935年5月刘伯承与小叶丹结盟，红军顺利通过大凉山彝区，书写民族团结佳话。",t:"民族团结"},
{q:""金色的鱼钩"中老班长用什么做鱼钩？",o:["铁丝","铜丝","缝衣针","别针"],a:2,e:"老班长用缝衣针做鱼钩钓鱼给伤员吃，自己饿死在草地。鱼钩现存军事博物馆。",t:"感人故事"},
{q:"红34师师长陈树湘被俘后？",o:["成功逃脱","绝食抗议","扯断肠子牺牲","说服敌军起义"],a:2,e:"陈树潮腹部中弹被俘，途中扯断自己肠子牺牲，年仅29岁，践行了革命誓言。",t:"英雄人物"},
{q:"红军长征翻越了多少座大山？",o:["约10座","约18座","约25座","约30座"],a:1,e:"翻越18座大山（其中5座雪山），渡过24条大河，途经14个省。",t:"基本数据"},
{q:"中央红军到达陕北的标志是？",o:["到达延安","到达吴起镇","到达会宁","到达保安"],a:1,e:"1935年10月19日到达吴起镇，毛泽东写道"不到长城非好汉，屈指行程二万"。",t:"重要时刻"},
{q:"长征精神的核心是什么？",o:["艰苦奋斗","坚定革命信念、救国救民","团结协作","以上都是"],a:3,e:"长征精神包括坚定信念、救国救民、不怕牺牲等，是中国共产党人精神谱系的重要组成。",t:"精神传承"},
{q:""巧渡金沙江"红军用了什么策略？",o:["搭浮桥","佯攻昆明、抢占皎平渡","武装泅渡","与守军谈判"],a:1,e:"佯攻昆明诱敌回防，抢占皎平渡口，7条小船7天7夜渡3万红军，跳出包围圈。",t:"经典战役"},
{q:"毛泽东《七律·长征》中"大渡桥横铁索寒"指？",o:["强渡大渡河","飞夺泸定桥","四渡赤水","突破乌江"],a:1,e:""铁索寒"三字写出铁索冰冷和战斗惊心动魄。"更喜岷山千里雪，三军过后尽开颜"收尾。",t:"诗词文化"},
{q:"腊子口地势特点是？",o:["开阔平原","密林","宽仅30米险隘","沙漠"],a:2,e:"腊子口宽仅30米，两侧百丈悬崖。红军正面强攻+侧翼攀登迂回攻克此天险。",t:"经典战役"},
{q:"毛主席如何评价长征意义？",o:["军事演习","宣言书、宣传队、播种机","只是开始","意外事件"],a:1,e:"长征是宣言书（宣告红军不可战胜）、宣传队（传播革命）、播种机（播下革命种子）。",t:"精神传承"},
{q:"红军三大主力会师地点是？",o:["延安","吴起镇","甘肃会宁","保安"],a:2,e:"1936年10月红一、二、四方面军在甘肃会宁会师，万里长征全部胜利结束。",t:"重要时刻"},
{q:"参加长征的女战士约多少人？",o:["约500人","约1000人","约2000人","约5000人"],a:2,e:"约2000多名女战士参加长征，与男战士一样爬雪山过草地，到达陕北仅剩数百人。",t:"人物故事"},
{q:"长征途中红军共经历了多少次战斗？",o:["约100次","约200次","约380次","约500次"],a:2,e:"约380次战斗，攻占700多座县城，平均每天都有遭遇战。",t:"基本数据"},
{q:""雪山上的军需处长"为什么冻死？",o:["迷路","把棉衣都发给了战士","缺棉衣","受伤"],a:1,e:"军需处长把自己管的棉衣全发给了战士，自己穿单衣冻死在雪山上，牺牲时仍保持坐姿。",t:"感人故事"},
{q:"长征中红军的粮食主要靠什么？",o:["统一配给","后方运送","打土豪+群众支援","空投"],a:2,e:"没有后方补给线，靠打土豪和群众支援。过雪山草地时吃草根、啃树皮、煮皮带。",t:"后勤保障"},
{q:"以下哪座山不是长征翻越的雪山？",o:["夹金山","梦笔山","长白山","打鼓山"],a:2,e:"长白山在东北，不在长征路线上。夹金山、梦笔山、打鼓山均在四川西部高原。",t:"行军路程"},
{q:""不到长城非好汉"出自毛泽东哪首词？",o:["《沁园春·雪》","《清平乐·六盘山》","《七律·长征》","《忆秦娥·娄山关》"],a:1,e:"出自《清平乐·六盘山》，写于1935年10月翻越六盘山时，是长征最后一座大山。",t:"诗词文化"},
{q:"强渡大渡河时首批渡河勇士多少人？",o:["8人","12人","18人","22人"],a:2,e:"18名勇士乘木船在敌军火力下冲向对岸，成功突破大渡河防线。",t:"经典战役"},
{q:"哪项不是四渡赤水的特点？",o:["灵活机动","以少胜多","阵地攻坚战为主","调动敌军"],a:2,e:"四渡赤水是运动战的典范，特点是声东击西、忽南忽北调动敌军，而非阵地攻坚战。",t:"经典战役"},
{q:"美国记者斯诺写长征的书是？",o:["《长征记》","《红色中国》","《西行漫记》(红星照耀中国)","《红军长征史》"],a:2,e:"斯诺1936年到陕北采访，写了《西行漫记》，第一次向世界客观报道了长征事迹。",t:"文化传播"}
];

// === 军衔 ===
var R=[{n:"新兵",e:"⭐",s:0},{n:"列兵",e:"🔰",s:100},{n:"上等兵",e:"🎖️",s:300},{n:"下士",e:"🛡️",s:600},{n:"中士",e:"⚔️",s:1000},{n:"上士",e:"🏹",s:1500},{n:"少尉",e:"⭐",s:2200},{n:"中尉",e:"🌟",s:3000},{n:"上尉",e:"✨",s:4000},{n:"少校",e:"🎯",s:5200},{n:"中校",e:"🏅",s:6600},{n:"上校",e:"🥇",s:8200},{n:"大校",e:"👑",s:10000},{n:"少将",e:"💎",s:12500},{n:"中将",e:"🔮",s:16000},{n:"上将",e:"🏆",s:20000},{n:"司令员",e:"🚩",s:25000}];

// === 数据 ===
var K='lmq_v2',D;
function ld(){
try{var r=localStorage.getItem(K);D=r?Object.assign({s:0,ta:0,tc:0,fc:999,st:0,la:null,sd:null,qh:{},ach:[]},JSON.parse(r)):{s:0,ta:0,tc:0,fc:999,st:0,la:null,sd:null,qh:{},ach:[]}}catch(e){D={s:0,ta:0,tc:0,fc:999,st:0,la:null,sd:null,qh:{},ach:[]}}}
function sv(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function td(){var d=new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function p(n){return n<10?'0'+n:''+n}
function yd(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function uStr(){var t=td(),y=yd();if(D.la===t)return;if(D.la===y)D.st+=1;else if(D.la!==t)D.st=1;D.la=t;if(!D.sd)D.sd=t}
function gRk(s){for(var i=R.length-1;i>=0;i--)if(s>=R[i].s)return R[i];return R[0]}
function gRkN(s){return gRk(s).n}

// === 成就 ===
var ACH=[{id:'a1',n:'初露锋芒',d:'首次答题',c:function(){return D.ta>0}},{id:'a2',n:'答题新星',d:'答对10题',c:function(){return D.tc>=10}},{id:'a3',n:'全对通关',d:'一次5题全对',c:function(){return(D.lr&&D.lr.c===5)}},{id:'a4',n:'三日坚持',d:'连续3天',c:function(){return D.st>=3}},{id:'a5',n:'一周坚持',d:'连续7天',c:function(){return D.st>=7}},{id:'a6',n:'闪电答题',d:'5秒内答对',c:function(){return D.fc<=5}},{id:'a7',n:'千分战士',d:'总积分1000+',c:function(){return D.s>=1000}},{id:'a8',n:'长征学霸',d:'答对100题',c:function(){return D.tc>=100}}];
function ckA(){var ne=[];for(var i=0;i<ACH.length;i++){var a=ACH[i];if(D.ach.indexOf(a.id)===-1&&a.c()){D.ach.push(a.id);ne.push(a)}}return ne}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3000)}

// === 出题 ===
function selQ(){var t=td(),s=0;for(var i=0;i<t.length;i++){s=((s<<5)-s)+t.charCodeAt(i);s|=0}var ix=Q.map(function(_,i){return i});s=Math.abs(s);for(var i=ix.length-1;i>0;i--){s=(s*16807+0)%2147483647;var j=s%(i+1);var tmp=ix[i];ix[i]=ix[j];ix[j]=tmp}return ix.slice(0,5).map(function(i){return Q[i]})}

// === 答题 ===
var qs=null,ti=null,ts=0,MT=30;
function startQuiz(){
var t=td();if(D.qh[t]&&D.qh[t].f){if(!confirm('今天已完成！重新挑战不计分，确定吗？'))return}
qs={q:selQ(),i:0,ans:[],tm:[],sc:0};switchTab('quiz');rq();
document.getElementById('quizResult').style.display='none';document.getElementById('quizCard').style.display='';
window.scrollTo(0,0)
}
function rq(){
if(!qs)return;var s=qs,q=s.q[s.i];var t=s.q.length,hd='';
for(var i=0;i<t;i++){var c='';if(s.ans[i]!=null)c=s.ans[i]===s.q[i].a?'done':'wrong';if(i===s.i&&s.ans[i]==null)c='cur';hd+='<div class="qd '+c+'"></div>'}
document.getElementById('quizDots').innerHTML=hd;
document.getElementById('quizNum').textContent='第 '+(s.i+1)+'/'+t+' 题';
document.getElementById('quizQ').textContent=q.q;
var l=['A','B','C','D'],oh='';
for(var i=0;i<q.o.length;i++){var cl='';if(s.ans[s.i]!=null){if(i===q.a)cl='ok';else if(i===s.ans[s.i])cl='no'}
oh+='<button class="qOpt '+cl+'" onclick="sel('+i+')" '+(s.ans[s.i]!=null?'disabled':'')+'><span class="ol">'+l[i]+'</span>'+q.o[i]+'</button>'}
document.getElementById('quizOpts').innerHTML=oh;
var ed=document.getElementById('quizExp'),et=document.getElementById('quizExpT');
if(s.ans[s.i]!=null){ed.classList.add('s');et.textContent=q.e}else{ed.classList.remove('s');et.textContent=''}
if(s.ans[s.i]==null)sT()
}
function sT(){clearInterval(ti);ts=0;ti=setInterval(function(){ts++;if(ts>=MT){clearInterval(ti);if(qs&&qs.ans[qs.i]==null)tUp()}},100)}
function tUp(){if(!qs)return;qs.ans[qs.i]=-1;qs.tm[qs.i]=MT;rq();setTimeout(an,2000)}
function sel(x){if(!qs||qs.ans[qs.i]!=null)return;clearInterval(ti);qs.ans[qs.i]=x;qs.tm[qs.i]=ts;var q=qs.q[qs.i],ok=x===q.a;
if(ok){var bs=100;if(ts<=10)bs+=20;if(ts<=5)bs+=10;var sb=0;for(var i=qs.i-1;i>=0;i--){if(qs.ans[i]===qs.q[i].a)sb+=10;else break}qs.sc+=bs+sb;if(ts<D.fc&&ts>0)D.fc=ts}rq();setTimeout(an,ok?1500:2500)}
function an(){if(!qs)return;if(qs.i<qs.q.length-1){qs.i++;rq()}else fq()}
function fq(){
var s=qs,t=s.q.length,c=0;for(var i=0;i<t;i++)if(s.ans[i]===s.q[i].a)c++;
uStr();var td_=td(),ad=!D.qh[td_]||!D.qh[td_].f;
if(ad){D.s+=s.sc;D.ta+=t;D.tc+=c;D.lr={c:c,t:t,sc:s.sc};D.qh[td_]={c:c,t:t,sc:s.sc,f:true,ts:Date.now()}}else D.lr={c:c,t:t,sc:s.sc};
var na=ckA();sv();
document.getElementById('quizCard').style.display='none';
var rc=document.getElementById('quizResult');rc.style.display='';
var pct=Math.round(c/t*100),ic,mg;
if(c===t){ic='🎉';mg='太棒了！全部答对！'}else if(c>=3){ic='👍';mg='表现不错，继续加油！'}else{ic='💪';mg='继续学习，你可以的！'}
document.getElementById('rIcon').textContent=ic;document.getElementById('rScore').textContent='+'+D.lr.sc;
document.getElementById('rDetail').innerHTML=mg+'<br>答对 <b>'+c+'</b>/'+t+' 题 · 正确率 '+pct+'%<br>总积分：<b style="color:var(--r)">'+D.s+'</b>';
if(na.length)toast(na[na.length-1].n+' 解锁！');uu();qs=null;clearInterval(ti)
}

// === UI ===
function uu(){uH();uL();uK();document.getElementById('streakBadge').textContent='🔥 连续 '+D.st+' 天'}
function uH(){
var rk=gRk(D.s),nr=R[R.indexOf(rk)+1];document.getElementById('rankEmoji').textContent=rk.e;
document.getElementById('rankName').textContent=rk.n;
if(nr){var p=D.s-rk.s,nd=nr.s-rk.s,pt=Math.min(100,p/nd*100);document.getElementById('rankSub').textContent='距'+nr.n+'还需 '+(nd-p)+' 积分';
document.getElementById('expBar').style.width=pt+'%';document.getElementById('expDetail').textContent=p+'/'+nd+' 积分'}
else{document.getElementById('rankSub').textContent='已到达最高军衔！';document.getElementById('expBar').style.width='100%';document.getElementById('expDetail').textContent=D.s+' 积分'}
document.getElementById('sScore').textContent=D.s.toLocaleString();document.getElementById('sCorrect').textContent=D.tc;
document.getElementById('sAccuracy').textContent=(D.ta>0?Math.round(D.tc/D.ta*100):0)+'%';
var t=td(),done=D.qh[t]&&D.qh[t].f;
if(done){document.getElementById('todayIcon').textContent='✅';document.getElementById('todayTitle').textContent='今日已完成';
document.getElementById('todayDesc').textContent='答对'+D.qh[t].c+'/'+D.qh[t].t+'题，+'+D.qh[t].sc+'分';
document.getElementById('startBtn').textContent='🔄 重新挑战';document.getElementById('startBtn').className='btn btn2 btnL'}
else{document.getElementById('todayIcon').textContent='📝';document.getElementById('todayTitle').textContent='今日挑战';
document.getElementById('todayDesc').textContent='每天5道长征知识题';document.getElementById('startBtn').textContent='⚡ 开始今日答题';
document.getElementById('startBtn').className='btn btn1 btnL'}
document.getElementById('todayInfo').textContent=done?'今日得分：+'+D.qh[t].sc+' 分':''
}

// === 排行榜 ===
var MU=[{n:'红色学者',a:'红',ts:15420,ws:320,ds:450},{n:'长征铁粉',a:'征',ts:12800,ws:280,ds:380},{n:'星火燎原',a:'星',ts:9650,ws:410,ds:520},{n:'雪山之鹰',a:'鹰',ts:8420,ws:190,ds:300},{n:'赤水行者',a:'赤',ts:7200,ws:350,ds:410},{n:'铁索勇士',a:'铁',ts:6100,ws:220,ds:250},{n:'草地铁流',a:'草',ts:5300,ws:160,ds:180},{n:'遵义先锋',a:'遵',ts:4100,ws:290,ds:350},{n:'瑞金传人',a:'瑞',ts:2800,ws:130,ds:200},{n:'湘江后浪',a:'湘',ts:1500,ws:95,ds:150},{n:'会宁新兵',a:'会',ts:620,ws:60,ds:90}];
var crt='total';
function swRank(t,b){crt=t;var bs=document.querySelectorAll('.rtab');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');uL()}
function uL(){
var t=td(),ws_='',d=new Date();d.setDate(d.getDate()-d.getDay());ws_=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
var mw=0,md=0;for(var dt in D.qh){if(dt>=ws_)mw+=D.qh[dt].sc||0;if(dt===t)md=D.qh[dt].sc||0}
var me={n:'我',a:'我',ts:D.s,ws:mw,ds:md,isMe:true};
var al=MU.map(function(u){return Object.assign({},u,{isMe:false})});al.push(me);
var key=crt==='total'?'ts':(crt==='weekly'?'ws':'ds');al.sort(function(a,b){return b[key]-a[key]});
var c=document.getElementById('rankList'),mr=-1,html='';
for(var i=0;i<Math.min(20,al.length);i++){var u=al[i];if(u.isMe)mr=i+1;
var mdls=['🥇','🥈','🥉'],num=i<3?mdls[i]:'<span style="color:#999;font-weight:700">'+(i+1)+'</span>';
var val=crt==='total'?u.ts.toLocaleString()+'分':(crt==='weekly'?u.ws+'分':u.ds+'分');
html+='<div class="ritem'+(u.isMe?' me':'')+'"><div style="font-size:20px;width:32px;text-align:center">'+num+'</div><div class="rav">'+u.a+'</div><div class="rinfo"><div class="rn">'+u.n+(u.isMe?' <span style="color:var(--r);font-size:11px">(我)</span>':'')+'</div><div style="font-size:11px;color:var(--ts)">'+gRkN(u.ts)+'</div></div><div class="rs">'+val+'</div></div>'}
c.innerHTML=html;document.getElementById('myRank').textContent=mr>0?'#'+mr:'-'
}

// === 知识库 ===
function uK(){var h='';for(var i=0;i<Q.length;i++){var q=Q[i];h+='<div class="kitem"><div class="kq">❓ '+q.q+'</div><div class="ka">✅ '+q.o[q.a]+'</div><div class="ke">📖 '+q.e+'</div><span style="display:inline-block;background:#FFF0E0;color:#B8860B;padding:2px 8px;border-radius:10px;font-size:10px;margin-top:6px">'+q.t+'</span></div>'}document.getElementById('klist').innerHTML=h}

// === 分享 ===
function shareText(){
var rk=gRk(D.s);var t='🚩 长征红色问答挑战\n⭐ 军衔：'+rk.n+' | 积分：'+D.s+'\n✅ 答对：'+D.tc+'题 | 正确率：'+(D.ta>0?Math.round(D.tc/D.ta*100):0)+'%\n🔥 连续打卡：'+D.st+'天\n\n快来挑战，传承红色基因！';
if(navigator.share){navigator.share({title:'长征红色问答挑战',text:t}).catch(function(){})}else{copyText(t);alert('已复制到剪贴板，粘贴分享即可！')}
}
function copyText(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}

// === 页面切换 ===
function switchTab(n){
var ps=document.querySelectorAll('.page');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');
var pg=document.getElementById('pg-'+n);if(pg)pg.classList.add('on');
var ts=document.querySelectorAll('.tab-i');for(var i=0;i<ts.length;i++)ts[i].classList.remove('on');
var tb=document.querySelector('[data-tab="'+n+'"]');if(tb)tb.classList.add('on');
window.scrollTo(0,0);if(n!=='quiz'){clearInterval(ti)}
}

// === 初始化 ===
ld();uu();uK();
</script>
